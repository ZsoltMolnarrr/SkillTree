# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.1
minecraft_compat_version=1.20.1

# Loader
enabled_platforms = fabric,forge
fabric_loader_version=0.19.5
forge_version=1.20.1-47.4.22

# Mod
maven_group=net.rpg_series
archives_name=skill_tree
mod_version=1.6.1.003

# Dependencies
fabric_api_version=0.92.12+1.20.1
# mavenLocal coordinates: net.tiny_config:tiny_config-<platform>:<version>
tiny_config_version=3.1.0.001
cloth_config_version=11.1.106
# PlayerAnimator 1.x (mod id `player-animator` on Fabric, `playeranimator` on Forge)
player_anim_version=1.0.2+1.19.4

# mavenLocal coordinates: net.spell_power:spell_power-<platform>:<version>
spell_power_version=1.6.0.001+1.20.1
# mavenLocal coordinates: net.spell_engine:spell_engine-<platform>:<version>
spell_engine_version=1.10.5.004+1.20.1

# Pufferfish's Skills — `net.puffish:skillsmod:<version>:<fabric|forge>` from https://maven.puffish.net.
# There is no `+1.20.1` line: the artifact for 1.20/1.20.1 is tagged `+1.20` (`minecraft ~1.20`).
# 0.16.7 is the same mod release the 1.21.1 line uses, and its public API is byte-identical
# to `0.16.7+1.21` — see docs/version-adoption-1.20.1/briefs/skilltree-port-notes.md §3.
pufferfish_skills_version=0.16.7+1.20

# RangedWeaponAPI is deliberately NOT a compile dependency, even though a two-platform 1.20.1 artifact
# now exists (net.foundation:ranged_weapon_api-<platform>:2.3.4.001+1.20.1): the two `ranged_weapon:*`
# attributes are only ever *written into skill data* as id strings, with an explicit fallback attribute,
# and are resolved by registry id at use time. RWA stays an optional dep on both loaders.
# See spellengine-port-notes.md §9.5 item 3.

# Fabric only
# Trinkets 3.7.2 is inherited transitively from SpellEngine; its nested Cardinal Components needs a dev pin.
trinkets_version=3.7.2
cardinal_components_version=5.2.0
mod_menu_version=7.2.1

# Class mods (mavenLocal, dev runtime only) — the skill trees reference their spells/items.
wizards_version=3.1.2.005+1.20.1
paladins_version=3.1.1.004+1.20.1
rogues_version=3.1.1.003+1.20.1
archers_version=3.1.1.002+1.20.1

# Forge only
curios_version=5.14.1+1.20.1
# Forge 47 does not bundle MixinExtras; SpellEngine JiJs it in production, but Loom does not load
# nested jars of classpath mods, so the dev runtime needs an explicit pin.
mixin_extras_version=0.5.5
