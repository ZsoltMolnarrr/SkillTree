# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=26.3
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.3     multiple: minecraft_compat_versions=26.3:26.3.1
minecraft_compat_versions=26.3

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.5
neoforge_version = 26.3.0.3-beta

# Mod
maven_group=net.rpg_series
archives_name=skill_tree
mod_version=1.6.1.002

# Dependencies
fabric_api_version=0.160.6+26.3
# TODO 26.3: TinyConfig has no 26.3 build (Modrinth checked 2026-09-20); 4.0.1 is proven to load on 26.3 (SpellPower, Critical Strike).
tiny_config_version=4.0.1
cloth_config_version=26.3.158
player_anim_version=1.2.7+mc.26.3

# TODO 26.3: the RPG Series upstreams come from mavenLocal (no 26.3 Modrinth releases yet) —
# 4-part dev versions. Flip the `maven.modrinth:*` lines in the three build.gradle files back on once released.
ranged_weapon_api_version=4.0.0.001+26.3
spell_power_version=1.6.2.001+26.3
spell_engine_version=1.10.7.008+26.3

# Pufferfish's Skills. Only used for the manifest dependency ranges — the jars themselves are pinned by
# Modrinth version id below.
pufferfish_skills_version=0.19.1
# TODO 26.3: back to `net.puffish:skillsmod:0.19.1+26.3:<platform>` from maven.puffish.net once it is published
# there — that maven still tops out at `0.18.3+26.2` (checked 2026-09-22). Until then the mod is pulled from the
# Modrinth maven, pinned BY VERSION ID rather than version number: both loader files are called `0.19.1`, so the
# number alone is ambiguous. `maven.modrinth:skills:<id>` resolves to
#   BciLrdpV -> puffish_skills-0.19.1-26.3-fabric.jar
#   lmyQQLE6 -> puffish_skills-0.19.1-26.3-neoforge.jar
pufferfish_skills_fabric_version_id=BciLrdpV
pufferfish_skills_neoforge_version_id=lmyQQLE6

# Fabric only
# Trinkets Updated 4.1 (mod id `trinkets_updated`, API package eu.pb4.trinkets.api) no longer uses
# Cardinal Components; it nests yumi-mc-foundation. Dev-runtime only (SpellEngine's optional integration).
trinkets_version=4.2.0+26.3
mod_menu_version=21.0.0-beta.1

# NeoForge only
# Dev-runtime pin only: this repo has no Curios source of its own (SpellEngine owns the integration).
curios_version=17.0.0-beta+26.3
